<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    </head>
    <body>
        <table border="1">
            <thead>
                <tr>
                    <th>Tables</th>
                    <th>Are</th>
                    <th>Cool</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>col 1 is</td>
                    <td>right-aligned</td>
                    <td>$100</td>
                </tr>
                <tr>
                    <td>col 1 is</td>
                    <td>centered</td>
                    <td>$200</td>
                </tr>
                <tr>
                    <td>zebra stripes</td>
                    <td>are neat</td>
                    <td>$1</td>
                </tr>
                <tr>
                    <td>
                        <ul>
                            <li>Item 1</li>
                            <li>Item 2</li>
                        </ul>
                    </td>
                    <td>see the last</td>
                    <td>from the first column</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
